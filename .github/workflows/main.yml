name: Windows-RDP-Australia

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: Windows RDP Access Enable Karna
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
    - name: RDP Password Set Karna
      run: |
        net user runneradmin Password@123
        
    - name: Ngrok Australia Tunnel Start Karna
      uses: nopresb/ngrok-tunnel-action@v1.2
      with:
        ngrok_auth_token: ${{ secrets.NGROK_AUTH_TOKEN }}
        port: 3389
        proto: tcp
        region: ap

    - name: Loop Chalaye Rakhna
      run: |
        $Loop = 1
        while ($Loop -eq 1) {
          Start-Sleep -Seconds 60
        }
