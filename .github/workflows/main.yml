name: Windows-RDP-Australia

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: Choco Se Ngrok Install Karna
      run: |
        choco install ngrok -y
    
    - name: Windows RDP Access Enable Karna
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
    - name: RDP Password Set Karna
      run: |
        net user runneradmin Password@123
        
    - name: Ngrok Authtoken aur Region Configure Karna
      run: |
        ngrok config add-authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"
        # Region ko config file mein set karna taake command parameter crash na kare
        Add-Content -Path "$env:USERPROFILE\AppData\Local\ngrok\ngrok.yml" -Value "region: ap"
        
    - name: Ngrok Australia Tunnel Direct Start Karna
      run: |
        $process = Start-Process ngrok -ArgumentList "tcp 3389" -PassThru
        Start-Sleep -Seconds 20
        if ($process.HasExited) {
            Write-Error "Ngrok dobara crash hua. Region remove karke default check karte hain."
        }
        
    - name: RDP Link Screen Par Dikhana
      run: |
        $response = Invoke-RestMethod -Uri http://127.0.0
        $address = $response.tunnels.public_url
        Write-Host "========================================"
        Write-Host "APNA RDP ADDRESS COPY KAREIN:"
        Write-Host $address
        Write-Host "========================================"
        
    - name: Loop Chalaye Rakhna
      run: |
        $Loop = 1
        while ($Loop -eq 1) {
          Start-Sleep -Seconds 60
        }
