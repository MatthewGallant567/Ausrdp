name: Windows-RDP-Australia

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: Choco Se Ngrok Install Karna
      run: |
        choco install ngrok -y
    
    - name: Ngrok AuthToken Connect Karna
      run: |
        ngrok config add-authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"
        
    - name: Windows RDP Access Enable Karna
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
    - name: RDP Password Set Karna
      run: |
        net user runneradmin Password@123
        
    - name: Ngrok Australia RDP Tunnel Start Karna
      run: |
        Start-Process ngrok -ArgumentList "tcp --region ap 3389"
        Start-Sleep -Seconds 30
        $tunnels = Invoke-RestMethod -Uri http://127.0.0
        Write-Host "----------------------------------------"
        Write-Host "RDP ADDRESS:" $tunnels.tunnels.public_url
        Write-Host "----------------------------------------"
        
    - name: Loop Chalaye Rakhna
      run: |
        $Loop = 1
        while ($Loop -eq 1) {
          Start-Sleep -Seconds 60
        }
